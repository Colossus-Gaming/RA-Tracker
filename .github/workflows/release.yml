name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.9.1). Only needed for manual runs.'
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      # fetch-depth: 0 is required — the release-from-main check below needs enough history to test
      # whether the tagged commit is reachable from main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Git tags are not branch-scoped: `on: push: tags` fires for a tag on ANY branch, so without
      # this a tag cut from develop would ship a release. Releases come from main only.
      - name: Verify the commit is on main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Explicit refspec: actions/checkout only configures a refspec for the ref it checked out,
          # so refs/remotes/origin/main is not guaranteed to exist without asking for it by name.
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' --quiet
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch main to validate the release commit" }

          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Refusing to release: commit $env:GITHUB_SHA is not reachable from main. " +
                  "Merge it to main first, then tag the merge commit."
          }
          Write-Host "Commit is on main - proceeding with the release."

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # The git tag is the single source of truth for the version: v1.9.1 -> 1.9.1
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Version '$version' is not in the expected N.N.N form."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $version"

      - name: Restore
        run: dotnet restore "Retro Achievement Tracker.sln"

      - name: Unit tests
        run: >
          dotnet test "Retro Achievement Tracker.Tests/Retro Achievement Tracker.Tests.csproj"
          -c Release
          --filter "TestCategory!=Integration"

      # Self-contained so users don't need the .NET 8 Desktop Runtime installed. Costs download
      # size on first install; Velopack deltas keep subsequent updates small.
      - name: Publish
        run: >
          dotnet publish "Retro Achievement Tracker.WPF/Retro Achievement Tracker.WPF.csproj"
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Verify published build has no developer tooling
        shell: pwsh
        run: |
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("publish/RATracker.WPF.dll"))
          foreach ($needle in 'probe-v2','probe-game','probe-alerts','find-game','log-to-file','TryRunDeveloperTool') {
            if ($text.Contains($needle)) { throw "Developer tooling leaked into the release build: $needle" }
          }
          Write-Host "OK - Production binary is clean."

      # The vpk CLI and the Velopack library must be the same version — a mismatch can produce
      # packages the installed client can't read. Read the version straight from the csproj so the
      # two can never drift.
      - name: Install Velopack CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csproj = [xml](Get-Content "Retro Achievement Tracker.WPF/Retro Achievement Tracker.WPF.csproj")
          $velopack = $csproj.Project.ItemGroup.PackageReference |
                      Where-Object { $_.Include -eq 'Velopack' } |
                      Select-Object -First 1
          if (-not $velopack) { throw "Velopack PackageReference not found in the csproj" }
          Write-Host "Installing vpk $($velopack.Version) to match the Velopack package"
          dotnet tool install -g vpk --version $velopack.Version
          if ($LASTEXITCODE -ne 0) { throw "vpk install failed" }

          # Global tools land here; make sure later steps can find vpk on PATH.
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Produces the installer, the delta/full packages and the RELEASES manifest the in-app
      # updater reads. --framework bootstraps the WebView2 runtime, which the custom video alerts
      # hard-depend on and which is not guaranteed to be present.
      - name: Package
        run: >
          vpk pack
          --packId ColossusGaming.RATracker
          --packTitle "Retro Achievement Tracker"
          --packAuthors "Colossus Gaming"
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe RATracker.WPF.exe
          --framework webview2
          --outputDir releases

      # Velopack's Setup.exe installs to a fixed per-user path with no folder-picker UI. This wraps
      # it in an Inno Setup wizard that adds the standard "choose install location" page and passes
      # the result through with --installto, so the user gets a real choice while Velopack keeps
      # ownership of shortcuts, uninstall registration and silent self-updating.
      - name: Build the install wizard
        shell: pwsh
        env:
          # Passed as an environment variable rather than interpolated into the script: a ${{ }}
          # expression inside a double-quoted PowerShell string is not parseable before Actions
          # substitutes it, which breaks linting and static checking of this step.
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = @(
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          # Runner images normally ship Inno Setup; install it if this one doesn't.
          if (-not $iscc) {
            Write-Host "Inno Setup not found on the runner - installing via Chocolatey"
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup" }
            $iscc = @(
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe still not found after install" }
          Write-Host "Using $iscc"

          $velopackSetup = Get-ChildItem releases -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $velopackSetup) { throw "Velopack Setup.exe not found in releases/" }

          & $iscc "/DVelopackSetup=$($velopackSetup.FullName)" `
                  "/DAppVersion=$env:APP_VERSION" `
                  "/Owizard" `
                  "installer/RATracker.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

          Get-ChildItem wizard | ForEach-Object { "built {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB) }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v${{ steps.version.outputs.version }}'

          # Create the release only if the tag doesn't already have one. Branch on the exit code
          # rather than on captured output — gh writes to stderr and PowerShell treats a native
          # command's stderr as an error record, which makes output-based checks unreliable.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release $tag"
            gh release create $tag --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          } else {
            Write-Host "Release $tag already exists; uploading assets to it"
          }

          # What ships:
          #   wizard/RATracker-Setup-<version>.exe  - the one file a user downloads and clicks
          #   RELEASES, releases.win.json, *.nupkg  - the feed the in-app updater reads
          #
          # Excluded: Velopack's own bare Setup.exe (it is bundled inside the wizard, and publishing
          # both would leave a user choosing between two installers, one without a folder picker),
          # and the portable zip (Velopack always emits one, there is no flag to suppress it, and it
          # is another ~75 MB download nothing references).
          $assets = @(
            Get-ChildItem -Path releases -File |
              Where-Object { $_.Name -notlike '*-Portable.zip' -and $_.Name -notlike '*-Setup.exe' } |
              ForEach-Object { $_.FullName }
          )
          $assets += @(Get-ChildItem -Path wizard -Filter '*.exe' -File | ForEach-Object { $_.FullName })

          if ($assets.Count -eq 0) { throw "no release artifacts were produced" }
          if (-not ($assets | Where-Object { $_ -like '*RATracker-Setup-*.exe' })) {
            throw "The install wizard was not produced - it is the whole point of the release"
          }
          Write-Host "Uploading $($assets.Count) asset(s)"

          # Splat so each path is a separate argument to gh.
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets to $tag" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-release-${{ steps.version.outputs.version }}
          path: releases/*
