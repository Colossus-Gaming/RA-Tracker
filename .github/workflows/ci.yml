name: CI

# Tests only — this workflow never publishes anything. Releasing happens exclusively from a tag on
# main (see release.yml).
#
# Deliberately NOT triggered by pushes to main: main is protected and only accepts pull requests,
# which already ran this workflow, and the release workflow re-runs the tests before publishing. A
# push trigger on main would just duplicate those runs for no added signal.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    # WPF targets net8.0-windows, so this cannot run on a Linux runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "Retro Achievement Tracker.sln"

      - name: Build (Release)
        run: dotnet build "Retro Achievement Tracker.sln" -c Release --no-restore

      # The Integration category drives the real app through UI Automation against the live
      # RetroAchievements API using the developer's saved credentials. There is no settings.json or
      # API key on a runner, so those are excluded here and are expected to be run locally.
      - name: Unit tests
        run: >
          dotnet test "Retro Achievement Tracker.Tests/Retro Achievement Tracker.Tests.csproj"
          -c Release --no-build
          --filter "TestCategory!=Integration"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      # A Release build must not contain the developer tooling (see the DEV_TOOLS block in the
      # csproj). This fails the build if any of those entry points leak into a Production binary.
      - name: Verify Release build has no developer tooling
        shell: pwsh
        run: |
          $dll = "Retro Achievement Tracker.WPF/bin/Release/net8.0-windows/RATracker.WPF.dll"
          if (-not (Test-Path $dll)) { throw "Release assembly not found at $dll" }
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll))
          $leaked = @()
          foreach ($needle in 'probe-v2','probe-game','probe-alerts','find-game','log-to-file','TryRunDeveloperTool') {
            if ($text.Contains($needle)) { $leaked += $needle }
          }
          if ($leaked.Count -gt 0) {
            throw "Developer tooling leaked into the Release binary: $($leaked -join ', ')"
          }
          Write-Host "OK - no developer tooling in the Release binary."
